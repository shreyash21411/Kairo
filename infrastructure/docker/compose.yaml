
services:
  kairo-postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    container_name: kairo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KAIRO_APP_USER: ${KAIRO_APP_USER:?Set KAIRO_APP_USER in .env}
      KAIRO_APP_PASSWORD: ${KAIRO_APP_PASSWORD:?Set KAIRO_APP_PASSWORD in .env}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - kairo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kairo_postgres_data:
    name: kairo_postgres_data
